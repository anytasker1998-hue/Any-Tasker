<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anytasker Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
header{padding:15px;background:#020617;display:flex;justify-content:space-between;align-items:center}
header input{padding:8px;border-radius:6px;border:none}
.grid{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:#020617;padding:20px;border-radius:14px;text-align:center}
.card i{font-size:30px;color:#3b82f6}
.card button{margin-top:12px;padding:8px;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.popup.active{display:flex}
.box{background:#020617;width:95%;max-width:550px;padding:20px;border-radius:14px}
.close{float:right;cursor:pointer}
input,textarea,select,button{width:100%;margin:6px 0;padding:8px;border-radius:6px;border:none}
button{background:#2563eb;color:#fff}
a{color:#3b82f6;display:inline-block;margin-top:8px}
small{opacity:.7}
</style>
</head>

<body>

<header>
<h2>Online Tools</h2>
<input id="search" placeholder="Search tool...">
</header>

<div class="grid" id="toolGrid"></div>

<div class="popup" id="popup">
 <div class="box">
  <span class="close" onclick="closeTool()">✖</span>
  <div id="toolArea"></div>
 </div>
</div>

<script>
/* ---------- TOOL LIST ---------- */
const tools=[
["img-compress","Image Compressor","fa-compress"],
["img-resize","Image Resizer","fa-expand"],
["img-convert","Image Converter","fa-image"],
["bg-remove","Background Remover","fa-scissors"],
["img-pdf","Image to PDF","fa-file-pdf"],
["pdf-merge","PDF Merger","fa-file-pdf"],
["pdf-split","PDF Splitter","fa-cut"],
["pdf-text","PDF to Text","fa-file-lines"],
["pdf-word","PDF to Word","fa-file-word"],
["summarizer","Text Summarizer","fa-align-left"],
["math","Math Solver","fa-calculator"],
["gpa","GPA Calculator","fa-graduation-cap"],
["word","Word Counter","fa-keyboard"]
];

const toolGrid=document.getElementById("toolGrid");
const popup=document.getElementById("popup");
const toolArea=document.getElementById("toolArea");
const search=document.getElementById("search");

/* ---------- LOAD TOOLS ---------- */
function loadTools(list=tools){
 toolGrid.innerHTML="";
 list.forEach(t=>{
  toolGrid.innerHTML+=`
  <div class="card">
   <i class="fas ${t[2]}"></i>
   <h3>${t[1]}</h3>
   <button onclick="openTool('${t[0]}')">Use</button>
  </div>`;
 });
}
loadTools();

search.onkeyup=()=>{
 const q=search.value.toLowerCase();
 loadTools(tools.filter(t=>t[1].toLowerCase().includes(q)));
};

/* ---------- TOOL OPEN ---------- */
function openTool(id){
 popup.classList.add("active");
 const map={
  "img-compress":compressUI,
  "img-resize":resizeUI,
  "img-convert":convertUI,
  "bg-remove":bgUI,
  "img-pdf":imgPdfUI,
  "pdf-merge":pdfMergeUI,
  "pdf-split":pdfSplitUI,
  "pdf-text":pdfTextUI,
  "pdf-word":pdfWordUI,
  "summarizer":sumUI,
  "math":mathUI,
  "gpa":gpaUI,
  "word":wordUI
 };
 toolArea.innerHTML=map[id]();
}
function closeTool(){popup.classList.remove("active")}

/* ---------- IMAGE COMPRESS ---------- */
function compressUI(){
return `<h3>Image Compressor</h3>
<input type="file" id="ci">
<input type="number" id="target" placeholder="Target size KB">
<button onclick="compressImg()">Compress</button>
<div id="co"></div>`;
}
function compressImg(){
 const f=ci.files[0];
 if(!f||!target.value)return;
 const img=new Image();
 const r=new FileReader();
 r.onload=e=>{
  img.onload=()=>{
   const c=document.createElement("canvas");
   c.width=img.width;c.height=img.height;
   c.getContext("2d").drawImage(img,0,0);
   let q=0.9;
   (function loop(){
    c.toBlob(b=>{
     if(b.size/1024>target.value && q>0.1){q-=0.05;loop();}
     else co.innerHTML=`<a download href="${URL.createObjectURL(b)}">Download (${(b.size/1024).toFixed(1)} KB)</a>`;
    },"image/jpeg",q);
   })();
  };
  img.src=e.target.result;
 };
 r.readAsDataURL(f);
}

/* ---------- IMAGE RESIZE ---------- */
function resizeUI(){
return `<h3>Image Resizer</h3>
<input type=file id=ri>
<input id=rw placeholder=Width>
<input id=rh placeholder=Height>
<button onclick=resize()>Resize</button>
<div id=ro></div>`;
}
function resize(){
 const f=ri.files[0];
 if(!f||!rw.value||!rh.value)return;
 const r=new FileReader();
 r.onload=e=>{
  const i=new Image();
  i.onload=()=>{
   const c=document.createElement("canvas");
   c.width=rw.value;c.height=rh.value;
   c.getContext("2d").drawImage(i,0,0,c.width,c.height);
   c.toBlob(b=>ro.innerHTML=`<a download href="${URL.createObjectURL(b)}">Download</a>`);
  };
  i.src=e.target.result;
 };
 r.readAsDataURL(f);
}

/* ---------- IMAGE CONVERT ---------- */
function convertUI(){
return `<h3>Image Converter</h3>
<input type=file id=vi>
<select id=fmt>
<option value="image/jpeg">JPG</option>
<option value="image/png">PNG</option>
</select>
<button onclick=convert()>Convert</button>
<div id=vo></div>`;
}
function convert(){
 const f=vi.files[0];
 if(!f)return;
 const r=new FileReader();
 r.onload=e=>{
  const i=new Image();
  i.onload=()=>{
   const c=document.createElement("canvas");
   c.width=i.width;c.height=i.height;
   c.getContext("2d").drawImage(i,0,0);
   c.toBlob(b=>vo.innerHTML=`<a download href="${URL.createObjectURL(b)}">Download</a>`,fmt.value);
  };
  i.src=e.target.result;
 };
 r.readAsDataURL(f);
}

/* ---------- BACKGROUND REMOVE ---------- */
function bgUI(){
return `<h3>Background Remover</h3>
<small>Works best with white background</small>
<input type=file id=bi>
<button onclick=bgRemove()>Remove</button>
<div id=bo></div>`;
}
function bgRemove(){
 const f=bi.files[0];
 if(!f)return;
 const r=new FileReader();
 r.onload=e=>{
  const i=new Image();
  i.onload=()=>{
   const c=document.createElement("canvas");
   c.width=i.width;c.height=i.height;
   const x=c.getContext("2d");
   x.drawImage(i,0,0);
   const d=x.getImageData(0,0,c.width,c.height);
   for(let j=0;j<d.data.length;j+=4){
    if(d.data[j]>240&&d.data[j+1]>240&&d.data[j+2]>240)d.data[j+3]=0;
   }
   x.putImageData(d,0,0);
   c.toBlob(b=>bo.innerHTML=`<a download="bg.png" href="${URL.createObjectURL(b)}">Download</a>`);
  };
  i.src=e.target.result;
 };
 r.readAsDataURL(f);
}

/* ---------- IMAGE TO PDF ---------- */
function imgPdfUI(){
return `<h3>Image to PDF</h3>
<input type=file multiple id=ipi>
<button onclick=imgPdf()>Convert</button>
<div id=ipo></div>`;
}
async function imgPdf(){
 const {PDFDocument}=PDFLib;
 const pdf=await PDFDocument.create();
 for(const f of ipi.files){
  const buf=await f.arrayBuffer();
  const img=f.type.includes("png")?await pdf.embedPng(buf):await pdf.embedJpg(buf);
  const p=pdf.addPage([img.width,img.height]);
  p.drawImage(img,{x:0,y:0,width:img.width,height:img.height});
 }
 const b=new Blob([await pdf.save()],{type:"application/pdf"});
 ipo.innerHTML=`<a download="images.pdf" href="${URL.createObjectURL(b)}">Download PDF</a>`;
}

/* ---------- PDF MERGE ---------- */
function pdfMergeUI(){
return `<h3>PDF Merger</h3>
<input type=file multiple id=pm>
<button onclick=mergePDF()>Merge</button>
<div id=pmo></div>`;
}
async function mergePDF(){
 const {PDFDocument}=PDFLib;
 const m=await PDFDocument.create();
 for(const f of pm.files){
  const p=await PDFDocument.load(await f.arrayBuffer());
  const pages=await m.copyPages(p,p.getPageIndices());
  pages.forEach(pg=>m.addPage(pg));
 }
 const b=new Blob([await m.save()],{type:"application/pdf"});
 pmo.innerHTML=`<a download="merged.pdf" href="${URL.createObjectURL(b)}">Download</a>`;
}

/* ---------- PDF SPLIT ---------- */
function pdfSplitUI(){
return `<h3>PDF Splitter</h3>
<input type=file id=ps>
<input id=pn placeholder="Split after page">
<button onclick=splitPDF()>Split</button>
<div id=pso></div>`;
}
async function splitPDF(){
 const {PDFDocument}=PDFLib;
 const p=await PDFDocument.load(await ps.files[0].arrayBuffer());
 const n=parseInt(pn.value);
 if(!n||n>=p.getPageCount())return alert("Invalid page number");
 const a=await PDFDocument.create();
 const b=await PDFDocument.create();
 (await a.copyPages(p,[...Array(n).keys()])).forEach(pg=>a.addPage(pg));
 (await b.copyPages(p,[...Array(p.getPageCount()-n).keys()].map(i=>i+n))).forEach(pg=>b.addPage(pg));
 pso.innerHTML=`
 <a download="part1.pdf" href="${URL.createObjectURL(new Blob([await a.save()]))}">Part 1</a><br>
 <a download="part2.pdf" href="${URL.createObjectURL(new Blob([await b.save()]))}">Part 2</a>`;
}

/* ---------- PDF TO TEXT ---------- */
function pdfTextUI(){
return `<h3>PDF to Text</h3>
<input type=file id=pt>
<button onclick=pdfText()>Extract</button>
<pre id=pto></pre>`;
}
async function pdfText(){
 const pdf=await pdfjsLib.getDocument(URL.createObjectURL(pt.files[0])).promise;
 let t="";
 for(let i=1;i<=pdf.numPages;i++){
  const p=await pdf.getPage(i);
  const c=await p.getTextContent();
  t+=c.items.map(i=>i.str).join(" ")+"\n\n";
 }
 pto.textContent=t;
}

/* ---------- PDF TO WORD ---------- */
function pdfWordUI(){
return `<h3>PDF to Word</h3>
<input type=file id=pw>
<button onclick=pdfWord()>Convert</button>
<div id=pwo></div>`;
}
async function pdfWord(){
 const pdf=await pdfjsLib.getDocument(URL.createObjectURL(pw.files[0])).promise;
 let t="";
 for(let i=1;i<=pdf.numPages;i++){
  const p=await pdf.getPage(i);
  const c=await p.getTextContent();
  t+=c.items.map(i=>i.str).join(" ")+"\n\n";
 }
 const blob=new Blob([t],{type:"application/msword"});
 pwo.innerHTML=`<a download="output.doc" href="${URL.createObjectURL(blob)}">Download Word</a>`;
}

/* ---------- TEXT SUMMARIZER ---------- */
function sumUI(){
return `<h3>Text Summarizer</h3>
<textarea id=st></textarea>
<button onclick=sum()>Summarize</button>
<div id=so></div>`;
}
function sum(){
 const s=st.value.split(".");
 so.textContent=s.slice(0,Math.ceil(s.length/3)).join(".");
}

/* ---------- SAFE MATH ---------- */
function mathUI(){
return `<h3>Math Solver</h3>
<input id=me placeholder="2*(3+4)">
<button onclick=solveMath()>Solve</button>
<div id=mo></div>`;
}
function solveMath(){
 const exp=me.value;
 if(!/^[0-9+\-*/().\s]+$/.test(exp))return mo.textContent="Invalid expression";
 mo.textContent="Result: "+Function(`return (${exp})`)();
}

/* ---------- GPA ---------- */
function gpaUI(){
return `<h3>GPA Calculator</h3>
<input id=g1 placeholder="Grades (comma)">
<input id=g2 placeholder="Credits (comma)">
<button onclick=gpa()>Calculate</button>
<div id=go></div>`;
}
function gpa(){
 const g=g1.value.split(",").map(Number);
 const c=g2.value.split(",").map(Number);
 if(g.length!==c.length||g.some(isNaN)||c.some(isNaN))return go.textContent="Invalid input";
 let s=0,t=0;
 g.forEach((v,i)=>{s+=v*c[i];t+=c[i]});
 go.textContent="GPA: "+(s/t).toFixed(2);
}

/* ---------- WORD COUNT ---------- */
function wordUI(){
return `<h3>Word Counter</h3>
<textarea id=wt></textarea>
<button onclick=countWords()>Count</button>
<div id=wo></div>`;
}
function countWords(){
 const v=wt.value.trim();
 wo.textContent="Words: "+(v? v.split(/\s+/).length:0);
}
</script>
</body>
</html>
