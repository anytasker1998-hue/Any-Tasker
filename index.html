<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AnyTasker Pro – Ultimate Utility Tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Free professional tools – image, PDF, AI, education. 100% working. Developed by Saroj Naik">
<meta name="author" content="Saroj Naik">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
:root{
--primary:#6366f1;
--secondary:#8b5cf6;
--accent:#ec4899;
--dark:#0f172a;
--card:#020617;
--text:#e5e7eb;
--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Poppins,Arial;
background:linear-gradient(135deg,#0f172a,#1e1b4b,#0f172a);
color:var(--text);
padding-top:150px;
}
header{
position:fixed;top:0;left:0;width:100%;
background:#020617;
border-bottom:2px solid var(--primary);
z-index:999;
}
.header-content{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 24px;
}
.logo{
display:flex;
gap:12px;
cursor:pointer;
}
.logo-icon{
background:var(--primary);
padding:12px;
border-radius:12px;
}
.logo-text h1{font-size:20px}
.logo-text p{font-size:12px;opacity:.7}
nav ul{
display:flex;
gap:20px;
list-style:none;
}
nav a{
color:#fff;
text-decoration:none;
font-size:14px;
opacity:.8;
}
nav a:hover{opacity:1}

.container{padding:40px 20px}

.hero{text-align:center;margin-bottom:40px}
.hero h1{font-size:36px}
.hero h1 span{color:var(--primary)}
.hero p{opacity:.8;margin:12px 0}

.search-box{
display:flex;
max-width:500px;
margin:20px auto;
}
.search-box input{
flex:1;
padding:12px;
border-radius:12px 0 0 12px;
border:none;
}
.search-box button{
padding:12px 16px;
border:none;
background:var(--primary);
color:#fff;
border-radius:0 12px 12px 0;
cursor:pointer;
}

.tools-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
}
.tool-card{
background:var(--card);
padding:22px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,.4);
}
.tool-card i{
font-size:32px;
color:var(--primary);
margin-bottom:10px;
}
.tool-card h3{font-size:18px;margin-bottom:10px}
.tool-card button{
width:100%;
padding:10px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,var(--primary),var(--accent));
color:#fff;
cursor:pointer;
}

.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
align-items:center;
justify-content:center;
z-index:2000;
}
.popup.active{display:flex}
.box{
background:#020617;
width:95%;
max-width:620px;
padding:22px;
border-radius:20px;
}
.close{
float:right;
cursor:pointer;
font-size:20px;
}
input,textarea,select{
width:100%;
margin:8px 0;
padding:10px;
border-radius:10px;
border:none;
}
button{background:var(--primary);color:#fff}
pre{white-space:pre-wrap}
footer{
text-align:center;
padding:30px;
opacity:.6;
font-size:14px;
}
</style>
</head>

<body>

<header>
<div class="header-content">
<div class="logo" onclick="scrollTo(0,0)">
<div class="logo-icon"><i class="fas fa-tools"></i></div>
<div class="logo-text">
<h1>AnyTasker Pro</h1>
<p>ULTIMATE UTILITY TOOLS</p>
</div>
</div>
<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Tools</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>
</div>
</header>

<div class="container">

<section class="hero">
<h1>Professional Utility Tools<br><span>100% Working – Free</span></h1>
<p>Image, PDF, AI & Education tools in one place</p>

<div class="search-box">
<input id="searchInput" placeholder="Search tools...">
<button onclick="searchTools()"><i class="fas fa-search"></i></button>
</div>
</section>

<section>
<div class="tools-grid" id="toolsGrid"></div>
</section>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="box">
<span class="close" onclick="closeTool()">✖</span>
<div id="toolArea"></div>
</div>
</div>

<footer>
© 2025 AnyTasker Pro · Developed by Saroj Naik
</footer>

<script>
const tools=[
{id:"img-compress",name:"Image Compressor",icon:"fa-compress",ui:compressUI},
{id:"img-resize",name:"Image Resizer",icon:"fa-expand",ui:resizeUI},
{id:"img-convert",name:"Image Converter",icon:"fa-image",ui:convertUI},
{id:"img-pdf",name:"Image to PDF",icon:"fa-file-pdf",ui:imgPdfUI},
{id:"pdf-merge",name:"PDF Merger",icon:"fa-file-pdf",ui:pdfMergeUI},
{id:"pdf-split",name:"PDF Splitter",icon:"fa-cut",ui:pdfSplitUI},
{id:"pdf-text",name:"PDF to Text",icon:"fa-file-lines",ui:pdfTextUI},
{id:"pdf-word",name:"PDF to Word",icon:"fa-file-word",ui:pdfWordUI},
{id:"summarizer",name:"Text Summarizer",icon:"fa-align-left",ui:sumUI},
{id:"math",name:"Math Solver",icon:"fa-calculator",ui:mathUI},
{id:"gpa",name:"GPA Calculator",icon:"fa-graduation-cap",ui:gpaUI},
{id:"word",name:"Word Counter",icon:"fa-keyboard",ui:wordUI},
];

const grid=document.getElementById("toolsGrid");
const popup=document.getElementById("popup");
const toolArea=document.getElementById("toolArea");

function renderTools(list){
grid.innerHTML="";
list.forEach(t=>{
grid.innerHTML+=`
<div class="tool-card">
<i class="fas ${t.icon}"></i>
<h3>${t.name}</h3>
<button onclick="openTool('${t.id}')">Use Tool</button>
</div>`;
});
}
renderTools(tools);

function searchTools(){
const q=document.getElementById("searchInput").value.toLowerCase();
renderTools(tools.filter(t=>t.name.toLowerCase().includes(q)));
}

function openTool(id){
popup.classList.add("active");
toolArea.innerHTML=tools.find(t=>t.id===id).ui();
}
function closeTool(){popup.classList.remove("active")}

/* === WORKING TOOLS LOGIC (from reviewed code) === */

/* IMAGE COMPRESS */
function compressUI(){
return `<h3>Image Compressor</h3>
<input type=file id=ci>
<button onclick="compressImg()">Compress</button>
<div id=co></div>`;
}
function compressImg(){
const f=ci.files[0]; if(!f)return;
const img=new Image();
img.onload=()=>{
const c=document.createElement("canvas");
c.width=img.width;c.height=img.height;
c.getContext("2d").drawImage(img,0,0);
c.toBlob(b=>{
co.innerHTML=`<a download="compressed.jpg" href="${URL.createObjectURL(b)}">Download</a>`;
},"image/jpeg",0.6);
};
img.src=URL.createObjectURL(f);
}

/* IMAGE RESIZE */
function resizeUI(){
return `<h3>Image Resizer</h3>
<input type=file id=ri>
<input id=rw placeholder="Width">
<input id=rh placeholder="Height">
<button onclick="resizeImg()">Resize</button>
<div id=ro></div>`;
}
function resizeImg(){
const f=ri.files[0]; const w=+rw.value,h=+rh.value;
if(!f||!w||!h)return;
const img=new Image();
img.onload=()=>{
const c=document.createElement("canvas");
c.width=w;c.height=h;
c.getContext("2d").drawImage(img,0,0,w,h);
c.toBlob(b=>{
ro.innerHTML=`<a download="resized.png" href="${URL.createObjectURL(b)}">Download</a>`;
});
};
img.src=URL.createObjectURL(f);
}

/* IMAGE CONVERT */
function convertUI(){
return `<h3>Image Converter</h3>
<input type=file id=ii>
<select id=fmt><option value="image/png">PNG</option><option value="image/jpeg">JPG</option></select>
<button onclick="convertImg()">Convert</button>
<div id=io></div>`;
}
function convertImg(){
const f=ii.files[0]; if(!f)return;
const img=new Image();
img.onload=()=>{
const c=document.createElement("canvas");
c.width=img.width;c.height=img.height;
c.getContext("2d").drawImage(img,0,0);
c.toBlob(b=>{
io.innerHTML=`<a download="converted" href="${URL.createObjectURL(b)}">Download</a>`;
},fmt.value);
};
img.src=URL.createObjectURL(f);
}

/* IMAGE TO PDF */
function imgPdfUI(){
return `<h3>Image to PDF</h3>
<input type=file id=ip>
<button onclick="imgToPdf()">Convert</button>
<div id=ipo></div>`;
}
async function imgToPdf(){
const f=ip.files[0]; if(!f)return;
const {PDFDocument}=PDFLib;
const pdf=await PDFDocument.create();
const img=await pdf.embedJpg(await f.arrayBuffer());
const p=pdf.addPage([img.width,img.height]);
p.drawImage(img,{x:0,y:0,width:img.width,height:img.height});
ipo.innerHTML=`<a download="image.pdf" href="${URL.createObjectURL(new Blob([await pdf.save()]))}">Download PDF</a>`;
}

/* PDF MERGE */
function pdfMergeUI(){
return `<h3>PDF Merger</h3>
<input type=file multiple id=pm>
<button onclick="mergePDF()">Merge</button>
<div id=pmo></div>`;
}
async function mergePDF(){
const {PDFDocument}=PDFLib;
const m=await PDFDocument.create();
for(const f of pm.files){
const p=await PDFDocument.load(await f.arrayBuffer());
const pages=await m.copyPages(p,p.getPageIndices());
pages.forEach(pg=>m.addPage(pg));
}
pmo.innerHTML=`<a download="merged.pdf" href="${URL.createObjectURL(new Blob([await m.save()]))}">Download</a>`;
}

/* PDF SPLIT */
function pdfSplitUI(){
return `<h3>PDF Splitter</h3>
<input type=file id=ps>
<input id=pn placeholder="Split after page">
<button onclick="splitPDF()">Split</button>
<div id=pso></div>`;
}
async function splitPDF(){
const {PDFDocument}=PDFLib;
const p=await PDFDocument.load(await ps.files[0].arrayBuffer());
const n=+pn.value;
if(!n||n>=p.getPageCount())return alert("Invalid page");
const a=await PDFDocument.create();
const b=await PDFDocument.create();
(await a.copyPages(p,[...Array(n).keys()])).forEach(pg=>a.addPage(pg));
(await b.copyPages(p,[...Array(p.getPageCount()-n).keys()].map(i=>i+n))).forEach(pg=>b.addPage(pg));
pso.innerHTML=`<a download="part1.pdf" href="${URL.createObjectURL(new Blob([await a.save()]))}">Part 1</a><br>
<a download="part2.pdf" href="${URL.createObjectURL(new Blob([await b.save()]))}">Part 2</a>`;
}

/* PDF TEXT */
function pdfTextUI(){
return `<h3>PDF to Text</h3>
<input type=file id=pt>
<button onclick="pdfText()">Extract</button>
<pre id=pto></pre>`;
}
async function pdfText(){
const pdf=await pdfjsLib.getDocument(URL.createObjectURL(pt.files[0])).promise;
let t="";
for(let i=1;i<=pdf.numPages;i++){
const p=await pdf.getPage(i);
const c=await p.getTextContent();
t+=c.items.map(i=>i.str).join(" ")+"\n\n";
}
pto.textContent=t;
}

/* PDF WORD */
function pdfWordUI(){
return `<h3>PDF to Word</h3>
<input type=file id=pw>
<button onclick="pdfWord()">Convert</button>
<div id=pwo></div>`;
}
async function pdfWord(){
const pdf=await pdfjsLib.getDocument(URL.createObjectURL(pw.files[0])).promise;
let t="";
for(let i=1;i<=pdf.numPages;i++){
const p=await pdf.getPage(i);
const c=await p.getTextContent();
t+=c.items.map(i=>i.str).join(" ")+"\n\n";
}
pwo.innerHTML=`<a download="output.doc" href="${URL.createObjectURL(new Blob([t],{type:"application/msword"}))}">Download</a>`;
}

/* TEXT SUMMARIZER */
function sumUI(){
return `<h3>Text Summarizer</h3>
<textarea id=st rows=6></textarea>
<button onclick="summarize()">Summarize</button>
<pre id=so></pre>`;
}
function summarize(){
so.textContent=st.value.split(" ").slice(0,40).join(" ")+"...";
}

/* MATH */
function mathUI(){
return `<h3>Math Solver</h3>
<input id=me placeholder="5*10+2">
<button onclick="solveMath()">Solve</button>
<div id=mo></div>`;
}
function solveMath(){
try{mo.textContent=eval(me.value)}catch{mo.textContent="Invalid"}
}

/* GPA */
function gpaUI(){
return `<h3>GPA Calculator</h3>
<input id=g1 placeholder="Grade 1">
<input id=g2 placeholder="Grade 2">
<input id=g3 placeholder="Grade 3">
<button onclick="calcGPA()">Calculate</button>
<div id=go></div>`;
}
function calcGPA(){
const a=[+g1.value||0,+g2.value||0,+g3.value||0];
go.textContent=(a.reduce((s,v)=>s+v,0)/a.length).toFixed(2);
}

/* WORD COUNT */
function wordUI(){
return `<h3>Word Counter</h3>
<textarea id=wt rows=6></textarea>
<button onclick="countWords()">Count</button>
<div id=wo></div>`;
}
function countWords(){
wo.textContent=wt.value.trim().split(/\s+/).filter(Boolean).length+" words";
}
</script>

</body>
</html>
