<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Candy Puzzle</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#8fd3f4,#fff);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* HOME */
.home{
  text-align:center;
}
.home h1{color:#ff5fa2}
.home button{
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:#ff5fa2;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* GAME */
.game-container{
  display:none;
  background:#fff;
  padding:15px;
  border-radius:22px;
  width:360px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.score,.level{text-align:center;font-weight:bold}
.board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:5px;
  margin-top:10px;
}
.cell{
  width:38px;height:38px;
  border-radius:12px;
  background-size:cover;
  background-position:center;
  cursor:pointer;
  transition:transform .15s,opacity .2s;
}
.cell:active{transform:scale(.9)}

.c1{background-image:url('https://i.imgur.com/1Q9Z1Zm.png')}
.c2{background-image:url('https://i.imgur.com/6h6ZQZp.png')}
.c3{background-image:url('https://i.imgur.com/yM6xW6Y.png')}
.c4{background-image:url('https://i.imgur.com/vh5bZcU.png')}
.c5{background-image:url('https://i.imgur.com/7lZV0Yq.png')}
.c6{background-image:url('https://i.imgur.com/3A6V3NQ.png')}
.bomb{background-image:url('https://i.imgur.com/JFZ4Y8M.png')}

/* POPUP */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  justify-content:center;
  align-items:center;
}
.popup{
  background:#fff;
  padding:20px;
  border-radius:20px;
  text-align:center;
}
.popup button{
  margin-top:10px;
  padding:8px 18px;
  border:none;
  border-radius:20px;
  background:#ff5fa2;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- HOME -->
<div class="home" id="home">
  <h1>Sweet Candy Puzzle</h1>
  <button onclick="startGame()">▶ Play</button>
</div>

<!-- GAME -->
<div class="game-container" id="game">
  <div class="level">Level <span id="level">1</span> | Target <span id="target">300</span></div>
  <div class="score">Score: <span id="score">0</span></div>
  <div class="board" id="board"></div>
</div>

<!-- LEVEL COMPLETE -->
<div class="overlay" id="overlay">
  <div class="popup">
    <h2>🎉 Level Complete</h2>
    <button onclick="nextLevel()">Next Level</button>
  </div>
</div>

<!-- Sounds -->
<audio id="swap" src="https://cdn.pixabay.com/audio/2022/03/10/audio_6d9c7f7a6b.mp3"></audio>
<audio id="match" src="https://cdn.pixabay.com/audio/2022/03/15/audio_c0e0c45c92.mp3"></audio>
<audio id="win" src="https://cdn.pixabay.com/audio/2022/03/15/audio_8c7b2e2c8d.mp3"></audio>

<script>
/* POPUNDER ON LEVEL COMPLETE */
function popunder(){
 let s=document.createElement('script');
 s.src="https://pl28252076.effectivegatecpm.com/76/34/e0/7634e0ba75ad0da90e9f859de28621fd.js";
 document.body.appendChild(s);
}

const board=document.getElementById('board');
const scoreEl=document.getElementById('score');
const levelEl=document.getElementById('level');
const targetEl=document.getElementById('target');
const overlay=document.getElementById('overlay');

const size=8;
const candies=['c1','c2','c3','c4','c5','c6'];
let cells=[],first=null,score=0,level=1,target=300;

function startGame(){
 document.getElementById('home').style.display='none';
 document.getElementById('game').style.display='block';
 createBoard();
}

function rand(){return candies[Math.floor(Math.random()*candies.length)]}

function createBoard(){
 board.innerHTML='';cells=[];
 for(let i=0;i<size*size;i++){
  const d=document.createElement('div');
  d.className='cell '+rand();
  d.onclick=()=>clickCell(d);
  board.appendChild(d);
  cells.push(d);
 }
}

function clickCell(c){
 document.getElementById('swap').play();
 if(!first){first=c;c.style.outline='3px solid #000';}
 else{
  swap(first,c);
  first.style.outline='none';
  first=null;
  setTimeout(checkMatches,120);
 }
}

function swap(a,b){
 let t=a.className;a.className=b.className;b.className=t;
}

function checkMatches(){
 let remove=[];
 for(let i=0;i<cells.length;i++){
  let cls=cells[i].className;
  if(cells[i+1] && cells[i+2] &&
     cls===cells[i+1].className &&
     cls===cells[i+2].className){
      remove.push(i,i+1,i+2);
  }
 }
 remove=[...new Set(remove)];
 if(remove.length){
  document.getElementById('match').play();
  score+=remove.length*10;
  scoreEl.textContent=score;
  remove.forEach(i=>cells[i].style.opacity=0);
  setTimeout(()=>{
    remove.forEach(i=>{
      cells[i].className='cell '+rand();
      cells[i].style.opacity=1;
    });
    if(score>=target){
      overlay.style.display='flex';
      document.getElementById('win').play();
      popunder();
    }
  },200);
 }
}

function nextLevel(){
 overlay.style.display='none';
 level++; target+=200; score=0;
 levelEl.textContent=level;
 targetEl.textContent=target;
 scoreEl.textContent=0;
 createBoard();
}
</script>

</body>
</html>
